<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Expenses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    // Simple JS function to export table as CSV
    function downloadCSV(filename) {
      let csv = [];
      let rows = document.querySelectorAll("table tr");

      for (let i = 0; i < rows.length; i++) {
        let row = [], cols = rows[i].querySelectorAll("td, th");
        for (let j = 0; j < cols.length; j++) {
          row.push(cols[j].innerText);
        }
        csv.push(row.join(","));
      }

      // Download CSV file
      let csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
      let downloadLink = document.createElement("a");
      downloadLink.download = filename;
      downloadLink.href = window.URL.createObjectURL(csvFile);
      downloadLink.style.display = "none";
      document.body.appendChild(downloadLink);
      downloadLink.click();
    }
  </script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">💳 My Expenses</h2>
    
    <!-- Expenses Table -->
    <div class="card shadow p-4">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>ExpenseID</th>
            <th>Category</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody>
          <!-- Example static data -->
          <tr>
            <td>1</td>
            <td>Food</td>
            <td>500</td>
            <td>2025-08-20</td>
            <td>Dinner with family</td>
          </tr>
          <tr>
            <td>2</td>
            <td>Travel</td>
            <td>1500</td>
            <td>2025-08-21</td>
            <td>Taxi & fuel</td>
          </tr>
          <!-- Fetch dynamically from DB -->
        </tbody>
      </table>

      <!-- Download Buttons -->
      <div class="mt-3 text-center">
        <button onclick="downloadCSV('expenses.csv')" class="btn btn-success">⬇️ Download as CSV</button>
      </div>
    </div>
  </div>
</body>
</html>
