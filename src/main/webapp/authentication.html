<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authentication Logs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h3 class="text-center mb-4">🕒 Authentication Logs</h3>
    <div class="card shadow p-4">
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Log ID</th>
            <th>User</th>
            <th>Login Time</th>
            <th>IP Address</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <!-- Example static row -->
          <tr>
            <td>1</td>
            <td>Ravi</td>
            <td>2025-08-22 10:45</td>
            <td>192.168.0.10</td>
            <td><span class="badge bg-success">SUCCESS</span></td>
          </tr>
          <!-- Dynamic data will come from DB -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
