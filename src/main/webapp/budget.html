<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Set Monthly Budget</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h3 class="text-center mb-4">📊 Set Monthly Budget</h3>
    <div class="card shadow p-4">
      <form action="set_budget.php" method="POST">
        <div class="mb-3">
          <label class="form-label">Month-Year</label>
          <input type="month" name="monthYear" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Budget Amount</label>
          <input type="number" step="0.01" name="budgetAmount" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-info w-100">Save Budget</button>
      </form>
    </div>
  </div>
</body>
</html>
